[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotload"
version = "0.1.0"
description = "Open-source video/audio downloader platform built on yt-dlp"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "yt-dlp>=2024.10.0",
  "arq>=0.26",
  "redis>=5",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "zipstream-ng>=1.7",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "argon2-cffi>=23.1",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "email-validator>=2.1",
  "alembic>=1.13",
  "boto3>=1.34",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.21", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotload = ["web/*", "canaries.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
