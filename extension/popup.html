<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>Hotload</title>
</head>
<body class="popup">
  <h1>Hot<span>load</span></h1>
  <section id="setup" hidden>
    <p>Set your Hotload server first.</p>
    <button id="open-options">Open settings</button>
  </section>
  <section id="bad" hidden><p>This page can't be downloaded.</p></section>
  <section id="ready" hidden>
    <p id="title" class="title"></p>
    <p id="host" class="muted"></p>
    <button id="open" class="primary">Open in Hotload</button>
    <div id="quick" hidden>
      <label for="preset">Quick download</label>
      <div class="row">
        <select id="preset"></select>
        <button id="go">Download</button>
      </div>
    </div>
    <p id="hint" class="muted" hidden>Add an API key in settings for one-click downloads.</p>
    <progress id="bar" max="100" value="0" hidden></progress>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="save" class="btn" hidden target="_blank" rel="noopener">Save file</a>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
