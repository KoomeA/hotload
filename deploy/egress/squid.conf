# Egress filter for the worker: the worker network is internal-only and can reach the internet solely through
# this proxy, which refuses private, loopback, link-local and metadata addresses. This is what constrains
# FFmpeg (which does its own networking and follows redirects) and anything yt-dlp's in-process guard misses.
http_port 3128
acl localnet_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl localnet_dst6 dst ::1 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96 64:ff9b:1::/48 2002::/16 2001::/32
# IPv6 literals are refused outright. A host name never contains ":", so this matches exactly the literals (NAT64, 6to4 and
# IPv4-mapped forms of private addresses among them). The dst6 list below does not cover them when squid runs without IPv6
# ("aclIpParseIpData: IPv6 has not been enabled": it then skips those rules), which was found by running this file.
acl ipv6_literal dstdom_regex -i :
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny ipv6_literal
http_access deny localnet_dst
http_access deny localnet_dst6
http_access allow all
cache deny all
# Squid runs as the unprivileged user `proxy`, which cannot open /dev/stdout (it crashes at start). Log to the default
# file instead: the ubuntu/squid image tails it to the container's stdout (`docker logs`).
access_log stdio:/var/log/squid/access.log
via off
forwarded_for delete
