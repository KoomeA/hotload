services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: ..
    env_file: ../.env
    ports: ["8000:8000"]
    volumes: ["media:/data"]
    depends_on: [redis]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Resource limits: a hostile link must not be able to take the whole host down. Tune for your hardware.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
  worker:
    build: ..
    command: ["arq", "hotload.worker.WorkerSettings"]
    env_file: ../.env
    volumes: ["media:/data"]
    depends_on: [redis]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g  # FFmpeg and large merges
    cpus: 2.0
    pids_limit: 512
  # Paying plans (when HOTLOAD_QUOTAS_ENABLED=true) are queued on a separate queue so free-tier load never delays them.
  # Remove this service for self-hosting: without plans enforced, everything uses the default queue.
  worker-priority:
    build: ..
    command: ["arq", "hotload.worker.WorkerSettings"]
    environment:
      HOTLOAD_WORKER_QUEUE: hotload:priority
    env_file: ../.env
    volumes: ["media:/data"]
    depends_on: [redis]
    restart: unless-stopped
    profiles: ["hosted"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
volumes:
  media:
